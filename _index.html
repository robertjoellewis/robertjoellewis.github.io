<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Causal Detective: Pearl's Path Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        
        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .title {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { text-shadow: 2px 2px 4px rgba(0,0,0,0.3), 0 0 20px rgba(255,255,255,0.2); }
            to { text-shadow: 2px 2px 4px rgba(0,0,0,0.3), 0 0 30px rgba(255,255,255,0.4); }
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        .game-area {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }
        
        .diagram-container {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 20px;
            min-height: 500px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .controls {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        svg {
            width: 100%;
            height: 100%;
            min-height: 460px;
        }
        
        .node {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .node circle {
            fill: #2196F3;
            stroke: #1976D2;
            stroke-width: 2;
        }
        
        .node.treatment circle {
            fill: #4CAF50;
            stroke: #388E3C;
        }
        
        .node.outcome circle {
            fill: #FF5722;
            stroke: #D84315;
        }
        
        .node.selected circle {
            fill: #FFD700;
            stroke: #FFA000;
            stroke-width: 4;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.6));
        }
        
        .node.blocked circle {
            fill: #9C27B0;
            stroke: #7B1FA2;
            stroke-width: 3;
            filter: drop-shadow(0 0 8px rgba(156, 39, 176, 0.6));
        }
        
        .node:hover circle {
            stroke-width: 3;
            filter: drop-shadow(0 0 8px rgba(0,0,0,0.4));
        }
        
        .node text {
            font-size: 14px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: central;
            fill: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
        }
        
        .edge {
            stroke: #333;
            stroke-width: 2;
            fill: none;
            marker-end: url(#arrowhead);
        }
        
        .edge.backdoor-path {
            stroke: #e91e63;
            stroke-width: 3;
            stroke-dasharray: 5,5;
            animation: dash 1s linear infinite;
        }
        
        .edge.blocked-path {
            stroke: #9C27B0;
            stroke-width: 3;
            opacity: 0.6;
        }
        
        @keyframes dash {
            to { stroke-dashoffset: -10; }
        }
        
        .question {
            background: rgba(33, 150, 243, 0.1);
            border: 2px solid #2196F3;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .question h3 {
            color: #FFD700;
            margin-bottom: 10px;
        }
        
        .controls button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(45deg, #FF9800, #F57C00);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }
        
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(45deg, #F44336, #D32F2F);
            color: white;
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(244, 67, 54, 0.4);
        }
        
        .feedback {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .feedback.correct {
            background: rgba(76, 175, 80, 0.2);
            border: 2px solid #4CAF50;
            color: #4CAF50;
        }
        
        .feedback.incorrect {
            background: rgba(244, 67, 54, 0.2);
            border: 2px solid #F44336;
            color: #F44336;
        }
        
        .level-indicator {
            font-size: 1.2em;
            color: #FFD700;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        .hint {
            background: rgba(255, 235, 59, 0.1);
            border: 1px solid #FFEB3B;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            font-size: 14px;
            color: #FFEB3B;
        }
        
        .paths-display {
            margin-top: 15px;
            font-size: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 10px;
        }
        
        .path {
            margin: 5px 0;
            padding: 5px;
            border-radius: 4px;
        }
        
        .path.backdoor {
            background: rgba(233, 30, 99, 0.2);
            border-left: 3px solid #e91e63;
        }
        
        .path.direct {
            background: rgba(76, 175, 80, 0.2);
            border-left: 3px solid #4CAF50;
        }
        
        .path.blocked {
            background: rgba(156, 39, 176, 0.2);
            border-left: 3px solid #9C27B0;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1 class="title">🕵️ Causal Detective</h1>
            <p>Master Judea Pearl's Backdoor Criterion</p>
        </div>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="score">0</div>
                <div>Score</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="level">1</div>
                <div>Level</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="streak">0</div>
                <div>Streak</div>
            </div>
        </div>
        
        <div class="game-area">
            <div class="diagram-container">
                <svg id="diagram">
                    <defs>
                        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
                                refX="9" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
                        </marker>
                    </defs>
                </svg>
            </div>
            
            <div class="controls">
                <div class="level-indicator">Level <span id="current-level">1</span></div>
                
                <div class="question" id="question">
                    <h3>Find the Confounders!</h3>
                    <p>Click on variables that need to be controlled to satisfy the backdoor criterion for estimating the causal effect of <strong>Treatment</strong> on <strong>Outcome</strong>.</p>
                </div>
                
                <button class="btn-primary" id="check-answer">Check Answer</button>
                <button class="btn-secondary" id="show-paths">Show Paths</button>
                <button class="btn-secondary" id="hint-btn">Hint</button>
                <button class="btn-danger" id="next-level">Next Level</button>
                
                <div id="feedback" class="feedback" style="display: none;"></div>
                
                <div class="hint" id="hint" style="display: none;">
                    <strong>💡 Hint:</strong> <span id="hint-text"></span>
                </div>
                
                <div class="paths-display" id="paths-display" style="display: none;">
                    <h4>Causal Paths:</h4>
                    <div id="paths-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class CausalInferenceGame {
            constructor() {
                this.score = 0;
                this.level = 1;
                this.streak = 0;
                this.selectedNodes = new Set();
                this.showingPaths = false;
                this.currentDiagram = null;
                
                this.levels = [
                    {
                        nodes: [
                            {id: 'T', x: 150, y: 200, label: 'Treatment', type: 'treatment'},
                            {id: 'Y', x: 450, y: 200, label: 'Outcome', type: 'outcome'},
                            {id: 'C', x: 300, y: 100, label: 'Confounder', type: 'confounder'}
                        ],
                        edges: [
                            {from: 'C', to: 'T'},
                            {from: 'C', to: 'Y'},
                            {from: 'T', to: 'Y'}
                        ],
                        correctAnswer: ['C'],
                        explanation: "C is a confounder that creates a backdoor path T ← C → Y. Control C to block this path.",
                        hint: "Look for variables that point to both treatment and outcome!"
                    },
                    {
                        nodes: [
                            {id: 'T', x: 150, y: 250, label: 'Treatment', type: 'treatment'},
                            {id: 'Y', x: 500, y: 250, label: 'Outcome', type: 'outcome'},
                            {id: 'C1', x: 250, y: 150, label: 'Confounder1', type: 'confounder'},
                            {id: 'C2', x: 400, y: 150, label: 'Confounder2', type: 'confounder'},
                            {id: 'M', x: 325, y: 350, label: 'Mediator', type: 'mediator'}
                        ],
                        edges: [
                            {from: 'C1', to: 'T'},
                            {from: 'C1', to: 'C2'},
                            {from: 'C2', to: 'Y'},
                            {from: 'T', to: 'M'},
                            {from: 'M', to: 'Y'},
                            {from: 'T', to: 'Y'}
                        ],
                        correctAnswer: ['C1'],
                        explanation: "Only C1 needs to be controlled. It blocks the backdoor path T ← C1 → C2 → Y. Don't control M (mediator)!",
                        hint: "Find the backdoor path and identify the minimum set to block it. Don't control mediators!"
                    },
                    {
                        nodes: [
                            {id: 'T', x: 150, y: 300, label: 'Treatment', type: 'treatment'},
                            {id: 'Y', x: 500, y: 300, label: 'Outcome', type: 'outcome'},
                            {id: 'C1', x: 200, y: 150, label: 'Confounder1', type: 'confounder'},
                            {id: 'C2', x: 450, y: 150, label: 'Confounder2', type: 'confounder'},
                            {id: 'U', x: 325, y: 50, label: 'Unobserved', type: 'unobserved'},
                            {id: 'Coll', x: 325, y: 400, label: 'Collider', type: 'collider'}
                        ],
                        edges: [
                            {from: 'U', to: 'C1'},
                            {from: 'U', to: 'C2'},
                            {from: 'C1', to: 'T'},
                            {from: 'C2', to: 'Y'},
                            {from: 'T', to: 'Coll'},
                            {from: 'Y', to: 'Coll'},
                            {from: 'T', to: 'Y'}
                        ],
                        correctAnswer: ['C1', 'C2'],
                        explanation: "Both C1 and C2 must be controlled to block the backdoor path T ← C1 ← U → C2 → Y. Don't control the collider!",
                        hint: "When there's an unobserved confounder, you need to control its observed children that are on the backdoor path."
                    },
                    {
                        nodes: [
                            {id: 'T', x: 100, y: 250, label: 'Treatment', type: 'treatment'},
                            {id: 'Y', x: 550, y: 250, label: 'Outcome', type: 'outcome'},
                            {id: 'C1', x: 200, y: 150, label: 'Conf1', type: 'confounder'},
                            {id: 'C2', x: 325, y: 100, label: 'Conf2', type: 'confounder'},
                            {id: 'C3', x: 450, y: 150, label: 'Conf3', type: 'confounder'},
                            {id: 'M1', x: 250, y: 350, label: 'Med1', type: 'mediator'},
                            {id: 'M2', x: 400, y: 350, label: 'Med2', type: 'mediator'}
                        ],
                        edges: [
                            {from: 'C2', to: 'C1'},
                            {from: 'C2', to: 'C3'},
                            {from: 'C1', to: 'T'},
                            {from: 'C3', to: 'Y'},
                            {from: 'T', to: 'M1'},
                            {from: 'M1', to: 'M2'},
                            {from: 'M2', to: 'Y'},
                            {from: 'T', to: 'Y'}
                        ],
                        correctAnswer: ['C2'],
                        explanation: "Only C2 needs to be controlled! It blocks the backdoor path T ← C1 ← C2 → C3 → Y. Controlling C2 is sufficient.",
                        hint: "Look for the most upstream confounder that can block all backdoor paths with minimal controls."
                    },
                    {
                        nodes: [
                            {id: 'T', x: 150, y: 300, label: 'Treatment', type: 'treatment'},
                            {id: 'Y', x: 500, y: 300, label: 'Outcome', type: 'outcome'},
                            {id: 'C1', x: 250, y: 150, label: 'Conf1', type: 'confounder'},
                            {id: 'C2', x: 400, y: 150, label: 'Conf2', type: 'confounder'},
                            {id: 'Coll1', x: 175, y: 200, label: 'Coll1', type: 'collider'},
                            {id: 'Coll2', x: 475, y: 200, label: 'Coll2', type: 'collider'},
                            {id: 'Desc', x: 325, y: 400, label: 'Descendant', type: 'descendant'}
                        ],
                        edges: [
                            {from: 'C1', to: 'Coll1'},
                            {from: 'T', to: 'Coll1'},
                            {from: 'C2', to: 'Coll2'},
                            {from: 'Y', to: 'Coll2'},
                            {from: 'C1', to: 'C2'},
                            {from: 'Coll2', to: 'Desc'},
                            {from: 'T', to: 'Y'}
                        ],
                        correctAnswer: [],
                        explanation: "No controls needed! All backdoor paths go through colliders, which naturally block the paths. Controlling colliders would open them!",
                        hint: "Sometimes the best strategy is to control nothing! Check if backdoor paths are already blocked by colliders."
                    }
                ];
                
                this.initializeGame();
                this.setupEventListeners();
                this.loadLevel();
            }
            
            initializeGame() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('level').textContent = this.level;
                document.getElementById('current-level').textContent = this.level;
                document.getElementById('streak').textContent = this.streak;
            }
            
            setupEventListeners() {
                document.getElementById('check-answer').addEventListener('click', () => this.checkAnswer());
                document.getElementById('show-paths').addEventListener('click', () => this.togglePaths());
                document.getElementById('hint-btn').addEventListener('click', () => this.showHint());
                document.getElementById('next-level').addEventListener('click', () => this.nextLevel());
            }
            
            loadLevel() {
                if (this.level > this.levels.length) {
                    this.showVictory();
                    return;
                }
                
                this.currentDiagram = this.levels[this.level - 1];
                this.selectedNodes.clear();
                this.showingPaths = false;
                
                document.getElementById('feedback').style.display = 'none';
                document.getElementById('hint').style.display = 'none';
                document.getElementById('paths-display').style.display = 'none';
                document.getElementById('next-level').style.display = 'none';
                
                this.renderDiagram();
            }
            
            renderDiagram() {
                const svg = document.getElementById('diagram');
                svg.innerHTML = `
                    <defs>
                        <marker id="arrowhead" markerWidth="10" markerHeight="7" 
                                refX="9" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
                        </marker>
                    </defs>
                `;
                
                // Draw edges first
                this.currentDiagram.edges.forEach(edge => {
                    const fromNode = this.currentDiagram.nodes.find(n => n.id === edge.from);
                    const toNode = this.currentDiagram.nodes.find(n => n.id === edge.to);
                    
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttributeNS(null, 'x1', fromNode.x);
                    line.setAttributeNS(null, 'y1', fromNode.y);
                    line.setAttributeNS(null, 'x2', toNode.x);
                    line.setAttributeNS(null, 'y2', toNode.y);
                    line.setAttributeNS(null, 'class', 'edge');
                    line.setAttributeNS(null, 'data-from', edge.from);
                    line.setAttributeNS(null, 'data-to', edge.to);
                    svg.appendChild(line);
                });
                
                // Draw nodes
                this.currentDiagram.nodes.forEach(node => {
                    const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    group.setAttributeNS(null, 'class', `node ${node.type}`);
                    group.setAttributeNS(null, 'data-id', node.id);
                    
                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttributeNS(null, 'cx', node.x);
                    circle.setAttributeNS(null, 'cy', node.y);
                    circle.setAttributeNS(null, 'r', 25);
                    
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttributeNS(null, 'x', node.x);
                    text.setAttributeNS(null, 'y', node.y);
                    text.textContent = node.label;
                    
                    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    label.setAttributeNS(null, 'x', node.x);
                    label.setAttributeNS(null, 'y', node.y + 45);
                    label.setAttributeNS(null, 'text-anchor', 'middle');
                    label.setAttributeNS(null, 'font-size', '12');
                    label.setAttributeNS(null, 'fill', '#333');
                    label.textContent = node.label;
                    
                    group.appendChild(circle);
                    group.appendChild(text);
                    group.appendChild(label);
                    
                    if (node.type !== 'treatment' && node.type !== 'outcome') {
                        group.addEventListener('click', () => this.toggleNode(node.id));
                    }
                    
                    svg.appendChild(group);
                });
            }
            
            toggleNode(nodeId) {
                if (this.selectedNodes.has(nodeId)) {
                    this.selectedNodes.delete(nodeId);
                } else {
                    this.selectedNodes.add(nodeId);
                }
                this.updateNodeAppearance();
            }
            
            updateNodeAppearance() {
                document.querySelectorAll('.node').forEach(node => {
                    const nodeId = node.getAttribute('data-id');
                    node.classList.remove('selected', 'blocked');
                    
                    if (this.selectedNodes.has(nodeId)) {
                        node.classList.add('selected');
                    }
                });
            }
            
            checkAnswer() {
                const correct = this.currentDiagram.correctAnswer;
                const selected = Array.from(this.selectedNodes);
                
                const isCorrect = correct.length === selected.length && 
                                correct.every(node => selected.includes(node));
                
                const feedback = document.getElementById('feedback');
                feedback.style.display = 'block';
                
                if (isCorrect) {
                    feedback.className = 'feedback correct';
                    feedback.textContent = '🎉 Correct! ' + this.currentDiagram.explanation;
                    this.score += 100 * this.level;
                    this.streak++;
                    document.getElementById('next-level').style.display = 'block';
                    
                    // Mark controlled nodes as blocked
                    this.selectedNodes.forEach(nodeId => {
                        const node = document.querySelector(`[data-id="${nodeId}"]`);
                        if (node) node.classList.add('blocked');
                    });
                } else {
                    feedback.className = 'feedback incorrect';
                    feedback.textContent = '❌ Not quite right. Try again! ' + 
                        (correct.length === 0 ? 'Hint: Sometimes no controls are needed!' : 
                         `Hint: You need to control ${correct.length} variable(s).`);
                    this.streak = 0;
                }
                
                this.updateStats();
            }
            
            togglePaths() {
                this.showingPaths = !this.showingPaths;
                const pathsDisplay = document.getElementById('paths-display');
                
                if (this.showingPaths) {
                    this.highlightPaths();
                    pathsDisplay.style.display = 'block';
                    document.getElementById('show-paths').textContent = 'Hide Paths';
                } else {
                    this.clearPathHighlights();
                    pathsDisplay.style.display = 'none';
                    document.getElementById('show-paths').textContent = 'Show Paths';
                }
            }
            
            highlightPaths() {
                // Find all paths from treatment to outcome
                const paths = this.findAllPaths('T', 'Y');
                const pathsList = document.getElementById('paths-list');
                pathsList.innerHTML = '';
                
                paths.forEach((path, index) => {
                    const pathDiv = document.createElement('div');
                    const isBackdoor = this.isBackdoorPath(path);
                    const isBlocked = this.isPathBlocked(path);
                    
                    pathDiv.className = `path ${isBackdoor ? 'backdoor' : 'direct'} ${isBlocked ? 'blocked' : ''}`;
                    pathDiv.innerHTML = `
                        <strong>${isBackdoor ? 'Backdoor' : 'Direct'} Path:</strong> ${path.join(' → ')}<br>
                        <small>${isBlocked ? '🚫 Blocked' : (isBackdoor ? '⚠️ Open backdoor' : '✅ Causal path')}</small>
                    `;
                    pathsList.appendChild(pathDiv);
                    
                    // Highlight edges in this path
                    for (let i = 0; i < path.length - 1; i++) {
                        const edge = document.querySelector(`[data-from="${path[i]}"][data-to="${path[i+1]}"], [data-from="${path[i+1]}"][data-to="${path[i]}"]`);
                        if (edge) {
                            edge.classList.add(isBackdoor ? 'backdoor-path' : 'direct-path');
                            if (isBlocked) edge.classList.add('blocked-path');
                        }
                    }
                });
            }
            
            clearPathHighlights() {
                document.querySelectorAll('.edge').forEach(edge => {
                    edge.classList.remove('backdoor-path', 'direct-path', 'blocked-path');
                });
            }
            
            findAllPaths(start, end, visited = new Set(), currentPath = []) {
                visited.add(start);
                currentPath.push(start);
                
                if (start === end) {
                    const pathCopy = [...currentPath];
                    visited.delete(start);
                    currentPath.pop();
                    return [pathCopy];
                }
                
                const paths = [];
                const neighbors = this.getNeighbors(start);
                
                for (const neighbor of neighbors) {
                    if (!visited.has(neighbor)) {
                        const subPaths = this.findAllPaths(neighbor, end, visited, currentPath);
                        paths.push(...subPaths);
                    }
                }
                
                visited.delete(start);
                currentPath.pop();
                return paths;
            }
            
            getNeighbors(nodeId) {
                const neighbors = [];
                this.currentDiagram.edges.forEach(edge => {
                    if (edge.from === nodeId) {
                        neighbors.push(edge.to);
                    } else if (edge.to === nodeId) {
                        neighbors.push(edge.from);
                    }
                });
                return neighbors;
            }
            
            isBackdoorPath(path) {
                // A backdoor path starts with an arrow pointing TO the treatment
                if (path.length < 3) return false;
                const firstEdge = this.currentDiagram.edges.find(e => 
                    (e.from === path[1] && e.to === path[0]) || 
                    (e.from === path[0] && e.to === path[1])
                );
                return firstEdge && firstEdge.to === path[0]; // Arrow points TO treatment
            }
            
            isPathBlocked(path) {
                // Check if path is blocked by selected nodes or colliders
                for (let i = 1; i < path.length - 1; i++) {
                    const node = path[i];
                    
                    // If we've selected this node, the path is blocked
                    if (this.selectedNodes.has(node)) {
                        return true;
                    }
                    
                    // Check if this is a collider (arrows pointing into it from both sides)
                    const prevNode = path[i - 1];
                    const nextNode = path[i + 1];
                    
                    const edge1 = this.currentDiagram.edges.find(e => 
                        (e.from === prevNode && e.to === node) || (e.from === node && e.to === prevNode)
                    );
                    const edge2 = this.currentDiagram.edges.find(e => 
                        (e.from === nextNode && e.to === node) || (e.from === node && e.to === nextNode)
                    );
                    
                    if (edge1 && edge2 && edge1.to === node && edge2.to === node) {
                        // This is a collider - path is blocked unless we control it or its descendants
                        if (!this.selectedNodes.has(node)) {
                            return true;
                        }
                    }
                }
                return false;
            }
            
            showHint() {
                const hint = document.getElementById('hint');
                const hintText = document.getElementById('hint-text');
                hintText.textContent = this.currentDiagram.hint;
                hint.style.display = 'block';
            }
            
            nextLevel() {
                this.level++;
                document.getElementById('level').textContent = this.level;
                document.getElementById('current-level').textContent = this.level;
                this.loadLevel();
            }
            
            updateStats() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('streak').textContent = this.streak;
            }
            
            showVictory() {
                const svg = document.getElementById('diagram');
                svg.innerHTML = `
                    <text x="300" y="200" text-anchor="middle" font-size="24" fill="#4CAF50" font-weight="bold">
                        🎉 Congratulations! 🎉
                    </text>
                    <text x="300" y="240" text-anchor="middle" font-size="18" fill="#333">
                        You've mastered Pearl's Backdoor Criterion!
                    </text>
                    <text x="300" y="280" text-anchor="middle" font-size="16" fill="#666">
                        Final Score: ${this.score} | Max Streak: ${this.streak}
                    </text>
                `;
                
                const feedback = document.getElementById('feedback');
                feedback.style.display = 'block';
                feedback.className = 'feedback correct';
                feedback.innerHTML = `
                    <h3>🏆 Master Detective Achievement Unlocked!</h3>
                    <p>You've successfully learned to identify confounders and apply the backdoor criterion. 
                    You now understand one of the most important concepts in causal inference!</p>
                    <p><strong>Key concepts mastered:</strong></p>
                    <ul style="text-align: left; margin-top: 10px;">
                        <li>Identifying backdoor paths</li>
                        <li>Controlling confounders</li>
                        <li>Avoiding collider bias</li>
                        <li>Not controlling mediators</li>
                        <li>Minimal sufficient adjustment sets</li>
                    </ul>
                `;
                
                // Hide unnecessary buttons
                document.getElementById('check-answer').style.display = 'none';
                document.getElementById('next-level').style.display = 'none';
                document.getElementById('show-paths').style.display = 'none';
                document.getElementById('hint-btn').style.display = 'none';
            }
        }
        
        // Start the game when the page loads
        window.addEventListener('DOMContentLoaded', () => {
            new CausalInferenceGame();
        });
    </script>
